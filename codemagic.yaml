
workflows:
  ios-release-build:
    name: iOS TestFlight Release Build
    max_build_duration: 120
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: MUKHDR_CONNECT

    environment:
      ios_signing:
        provisioning_profiles:
          - Mukhdr_AppStore_Profile_New
        certificates:
          - Mukhdr_Distribution_20260
      vars:
        XCODE_SCHEME: "App"

    scripts:
      - name: Install Dependencies
        script: |
          npm install

          if [ ! -d "www" ]; then
            mkdir -p www
            echo "<script>window.location.href = 'https://mukhdr.shop';</script>" > www/index.html
          fi

          npm run build --if-present

      - name: Setup iOS & Pods
        script: |
          rm -rf ios
          npx cap add ios --packagemanager CocoaPods
          npx cap sync ios

          cd ios/App

          if [ ! -f "Podfile" ]; then
            echo "ERROR: Podfile was not generated."
            exit 1
          fi

          pod install

      - name: Configure Meta App Events
        script: |
          python3 <<'PY'
          import plistlib
          from pathlib import Path

          app_id = "2015354905751447"
          client_token = "PASTE_CLIENT_TOKEN_HERE"
          display_name = "مخضر ios"

          if client_token == "ad08e3315d4d0908b4eeba8f6f6b7300":
              raise SystemExit(
                  "ERROR: Replace PASTE_CLIENT_TOKEN_HERE with your Meta Client Token."
              )

          plist_path = Path("ios/App/App/Info.plist")
          if not plist_path.exists():
              raise SystemExit(f"ERROR: Missing {plist_path}")

          with plist_path.open("rb") as f:
              plist = plistlib.load(f)

          plist["FacebookAppID"] = app_id
          plist["FacebookClientToken"] = client_token
          plist["FacebookDisplayName"] = display_name
          plist["FacebookAutoLogAppEventsEnabled"] = True

          url_types = plist.get("CFBundleURLTypes", [])
          scheme = "fb" + app_id
          found = False

          for item in url_types:
              schemes = item.get("CFBundleURLSchemes", [])
              if scheme in schemes:
                  found = True
                  break

          if not found:
              url_types.append({"CFBundleURLSchemes": [scheme]})

          plist["CFBundleURLTypes"] = url_types

          query_schemes = set(plist.get("LSApplicationQueriesSchemes", []))
          query_schemes.update([
              "fbapi",
              "fb-messenger-share-api",
              "fbauth2",
              "fbshareextension"
          ])
          plist["LSApplicationQueriesSchemes"] = sorted(query_schemes)

          with plist_path.open("wb") as f:
              plistlib.dump(plist, f)

          print("Meta app settings added to Info.plist.")
          PY

          python3 <<'PY'
          from pathlib import Path

          path = Path("ios/App/App/AppDelegate.swift")
          if not path.exists():
              raise SystemExit(f"ERROR: Missing {path}")

          source = path.read_text()

          if "import FBSDKCoreKit" not in source:
              source = source.replace(
                  "import Capacitor",
                  "import Capacitor\nimport FBSDKCoreKit",
                  1
              )

          launch_old = """        // Override point for customization after application launch.
                  return true"""

          launch_new = """        ApplicationDelegate.shared.application(
                      application,
                      didFinishLaunchingWithOptions: launchOptions
                  )
                  return true"""

          if "ApplicationDelegate.shared.application(" not in source:
              if launch_old not in source:
                  raise SystemExit(
                      "ERROR: Could not locate the launch method. AppDelegate was not changed."
                  )
              source = source.replace(launch_old, launch_new, 1)

          url_old = """        return ApplicationDelegateProxy.shared.application(app, open: url, options: options)"""

          url_new = """        let handledByMeta = ApplicationDelegate.shared.application(
                    app,
                    open: url,
                    options: options
                )
                let handledByCapacitor = ApplicationDelegateProxy.shared.application(
                    app,
                    open: url,
                    options: options
                )
                return handledByMeta || handledByCapacitor"""

          if "let handledByMeta = ApplicationDelegate.shared.application(" not in source:
              if url_old not in source:
                  raise SystemExit(
                      "ERROR: Could not locate the URL callback. AppDelegate was not changed."
                  )
              source = source.replace(url_old, url_new, 1)

          path.write_text(source)
          print("Meta SDK lifecycle and URL callbacks configured.")
          PY

      - name: Apply Mukhdr App Icon
        script: |
          if [ ! -f "mukhdr-ios-icon.zip" ]; then
            echo "ERROR: mukhdr-ios-icon.zip was not found in the repository root."
            exit 1
          fi

          mkdir -p /tmp/mukhdr-icon
          unzip -o mukhdr-ios-icon.zip -d /tmp/mukhdr-icon

          ICON_SOURCE="/tmp/mukhdr-icon/AppIcon.appiconset"
          ICON_DEST="ios/App/App/Assets.xcassets/AppIcon.appiconset"

          if [ ! -f "$ICON_SOURCE/Contents.json" ]; then
            echo "ERROR: AppIcon.appiconset/Contents.json was not found."
            find /tmp/mukhdr-icon -maxdepth 4 -type f
            exit 1
          fi

          if [ ! -d "ios/App/App/Assets.xcassets" ]; then
            echo "ERROR: Assets.xcassets was not found."
            find ios -name "Assets.xcassets" -print
            exit 1
          fi

          rm -rf "$ICON_DEST"
          cp -R "$ICON_SOURCE" "$ICON_DEST"

          echo "Mukhdr app icon installed successfully."

      - name: Configure iOS Location Permission
        script: |
          PLIST="ios/App/App/Info.plist"

          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription نحتاج إلى موقعك الحالي لتحديد عنوان توصيل طلبك بدقة." "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string نحتاج إلى موقعك الحالي لتحديد عنوان توصيل طلبك بدقة." "$PLIST"

          echo "Location permission configured."

      - name: Increment Build Number Automatically
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Set Up Code Signing Profiles
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA for App Store / TestFlight
        script: |
          cd ios/App

          xcode-project build-ipa \
            --workspace "App.xcworkspace" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

