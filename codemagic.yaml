workflows:
  ios-simulator-build:
    name: iOS Simulator Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Ensure Web Assets (www) Exist
        script: |
          if [ ! -d "www" ]; then
            mkdir www
            echo "<script>window.location.href = 'https://mukhdr.shop';</script>" > www/index.html
          fi
      - name: Fresh Setup Capacitor iOS and Pods
        script: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          cd ios
          pod install
      - name: Build iOS App for Simulator
        script: |
          cd ios
          xcodebuild -workspace App/App.xcworkspace \
                     -scheme App \
                     -sdk iphonesimulator \
                     -configuration Debug \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/build/Build/Products/Debug-iphonesimulator/*.app