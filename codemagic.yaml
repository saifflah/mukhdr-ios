
workflows:
  ios-release-build:
    name: iOS TestFlight Release Build
    max_build_duration: 120
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: MUKHDR_CONNECT

    environment:
      ios_signing:
        provisioning_profiles:
          - Mukhdr_AppStore_Profile_New
        certificates:
          - Mukhdr_Distribution_20260
      vars:
        XCODE_SCHEME: "App"

    scripts:
      - name: Install Dependencies
        script: |
          npm install

          if [ ! -d "www" ]; then
            mkdir -p www
            echo "<script>window.location.href = 'https://mukhdr.shop';</script>" > www/index.html
          fi

          npm run build --if-present

      - name: Setup iOS & Pods
        script: |
          rm -rf ios
          npx cap add ios --packagemanager CocoaPods
          npx cap sync ios

          cd ios/App

          if [ ! -f "Podfile" ]; then
            echo "ERROR: Podfile was not generated."
            exit 1
          fi

          pod install

      - name: Apply Mukhdr App Icon
        script: |
          if [ ! -f "mukhdr-ios-icon.zip" ]; then
            echo "ERROR: mukhdr-ios-icon.zip was not found in the repository root."
            exit 1
          fi

          mkdir -p /tmp/mukhdr-icon
          unzip -o mukhdr-ios-icon.zip -d /tmp/mukhdr-icon

          ICON_SOURCE="/tmp/mukhdr-icon/AppIcon.appiconset"
          ICON_DEST="ios/App/App/Assets.xcassets/AppIcon.appiconset"

          if [ ! -f "$ICON_SOURCE/Contents.json" ]; then
            echo "ERROR: AppIcon.appiconset/Contents.json was not found."
            find /tmp/mukhdr-icon -maxdepth 4 -type f
            exit 1
          fi

          if [ ! -d "ios/App/App/Assets.xcassets" ]; then
            echo "ERROR: Assets.xcassets was not found."
            find ios -name "Assets.xcassets" -print
            exit 1
          fi

          rm -rf "$ICON_DEST"
          cp -R "$ICON_SOURCE" "$ICON_DEST"

          echo "Mukhdr app icon installed successfully."

      - name: Configure iOS Location Permission
        script: |
          PLIST="ios/App/App/Info.plist"

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist was not found at $PLIST"
            find ios -name "Info.plist" -print
            exit 1
          fi

          if /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription نحتاج إلى موقعك الحالي لتحديد عنوان توصيل طلبك بدقة." "$PLIST"
          else
            /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string نحتاج إلى موقعك الحالي لتحديد عنوان توصيل طلبك بدقة." "$PLIST"
          fi

          echo "Location permission description configured:"
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$PLIST"

      - name: Increment Build Number Automatically
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Set Up Code Signing Profiles
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA for App Store / TestFlight
        script: |
          cd ios/App

          xcode-project build-ipa \
            --workspace "App.xcworkspace" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
